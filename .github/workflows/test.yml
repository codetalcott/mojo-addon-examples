name: Build & Test

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && fromJSON('["macos-latest", "ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          manifest-path: pixi.toml

      - name: Install dependencies
        run: npm install

      - name: Build all examples
        run: pixi run bash -c "npm run build:all"

      # Compile-only coverage for the targets `build:all` misses. These are not
      # tested here on purpose: every one of them is GPU-execution code, and
      # neither runner can run it — ubuntu-latest has no NVIDIA GPU, and Metal
      # inside the macos-latest VM is unproven. Their correctness gate is
      # scripts/verify-all.sh locally and scripts/verify-gpu-h100.sh on a pod.
      #
      # Compiling them here still earns its keep: packages/retrieve sat
      # uncompiled from Apr 17 to Aug 12 and silently missed an entire
      # napi-mojo + Mojo 1.0.0 migration, because nothing in CI ever built it.
      # This is also the only place the Linux/sm_90 cross-compile that ships to
      # RunPod gets exercised — a Darwin laptop cannot produce it.
      - name: Build cached variants (compile-only)
        run: pixi run bash -c "npm run build:cached"

      - name: Build packages/retrieve (compile-only)
        run: pixi run bash -c "npm run build:retrieve"

      # Ordered after retrieve to mirror the runtime dependency (embed loads
      # retrieve into the same process), though the compile itself is
      # standalone — src/lib.mojo imports its Python module at runtime, so this
      # step needs no model weights and no GPU.
      - name: Build packages/embed (compile-only)
        run: pixi run bash -c "npm run build:embed"

      - name: Run smoke tests
        run: pixi run bash -c "npm test"

      # GPU-execution suites, macOS only. Not a preference — the whole available
      # surface. ubuntu-latest has no NVIDIA GPU and never will; macos-latest
      # can execute Metal, but only partly.
      #
      # WHICH suites run here is measured, not assumed. metal-probe.yml ran all
      # five independently (run 31630265503):
      #
      #   simd-search  hand-rolled std.gpu  pass (220 cases)
      #   stats        hand-rolled std.gpu  pass (208 cases)
      #   image        hand-rolled std.gpu  pass (210 cases)
      #   matmul       linalg/layout        FAIL
      #   retrieve     linalg/layout        FAIL
      #
      # The runner's Metal device runs hand-rolled std.gpu kernels but not
      # linalg-backed ones — tiers 2 vs 3/4 in
      # docs/mojo-runtime-isolation-spike-findings.md. packages/retrieve shows
      # the split cleanly: loadMatrixGpu and every lifecycle/error-path test
      # pass, while all four tests invoking matmulHandle/searchHandle fail.
      # Allocation works, computation does not. So matmul and retrieve stay out
      # of CI; both pass on real NVIDIA, verified by pod runs.
      #
      # One step per suite, never an && chain: chaining lets the first failure
      # hide the rest, which is exactly how the earlier version of this hid
      # three suites behind matmul, and what CLAUDE.md warns about for npm test.
      #
      # Asymmetry to keep in mind: macos-latest runs only on PRs targeting main,
      # so these gate PRs but NOT pushes to main and NOT the weekly cron — both
      # ubuntu-only. scripts/verify-all.sh (local) and scripts/verify-gpu-h100.sh
      # (pod) remain the complete gate; this is a free subset.
      - name: GPU — simd-search cached (macOS only)
        if: runner.os == 'macOS'
        run: pixi run node examples/simd-search/test_cached.js

      - name: GPU — stats cached (macOS only)
        if: runner.os == 'macOS'
        run: pixi run node examples/stats/test_cached.js

      - name: GPU — image cached (macOS only)
        if: runner.os == 'macOS'
        run: pixi run node examples/image/test_cached.js
