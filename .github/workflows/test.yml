name: Build & Test

on:
  schedule:
    - cron: '0 8 * * 3'  # Wednesday 8am UTC (after napi-mojo canary Mon/Thu)
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: mojo-addon-examples

      - uses: actions/checkout@v4
        with:
          repository: codetalcott/mojo-node-api
          path: mojo-node-api

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          manifest-path: mojo-addon-examples/pixi.toml

      - name: Install dependencies
        working-directory: mojo-addon-examples
        run: npm install

      - name: Build all examples
        working-directory: mojo-addon-examples
        run: pixi run bash -c "npm run build:all"

      - name: Run smoke tests
        working-directory: mojo-addon-examples
        run: npm test
