name: Metal GPU probe (manual)

# Answers one question: can a GitHub-hosted macos-latest runner EXECUTE Metal
# GPU code, or only compile it?
#
# Why it is unknown. test.yml compiles GPU kernels on macos-latest and always
# has, so the Metal Toolchain is clearly present in the runner image. But
# nothing in this repo has ever *run* GPU code in CI — all five test.js files
# in `npm test` are CPU-only. macos-latest is a VM, and Metal device
# availability inside it is not something we can assume either way.
#
# Why it matters. If Metal works here, the four *_cached suites and
# packages/retrieve's Jest (12 GPU-execution tests total) could move into
# test.yml, turning compile-only coverage into real correctness coverage on
# every PR. If it does not, that door is closed and GPU correctness stays
# where it is — scripts/verify-all.sh locally, scripts/verify-gpu-h100.sh on a
# pod — and we stop wondering.
#
# workflow_dispatch ONLY, deliberately: no push, pull_request, or schedule
# trigger, so this costs nothing until a human runs it. Run it from the Actions
# tab, read the summary, and act on the result. Leave it dormant afterwards.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          manifest-path: pixi.toml

      - name: Install dependencies
        run: npm install

      - name: Report Metal Toolchain and GPU visibility
        run: |
          xcodebuild -showComponent MetalToolchain 2>&1 | head -5 || true
          echo "--- Metal devices seen by the OS ---"
          system_profiler SPDisplaysDataType 2>/dev/null | head -20 || echo "(system_profiler returned nothing)"

      # build:all is required, not optional: stats/test_cached.js and
      # image/test_cached.js load BOTH the one-shot and the cached addon. A
      # previous run of this probe built only build:cached + build:retrieve and
      # recorded stats and image as GPU failures when they had in fact died on
      # "stats.node not found" — a missing prerequisite, not a Metal limit.
      - name: Build all GPU targets
        run: pixi run bash -c "npm run build:all && npm run build:cached && npm run build:retrieve"

      # Every GPU suite, each isolated behind continue-on-error so one failure
      # cannot mask the others.
      #
      # The first version of this probe ran ONLY simd-search, and its passing
      # was generalised to "Metal works, promote everything." That was wrong:
      # promoting all five (#23) failed on matmul, whose handle API is backed by
      # linalg.matmul[target="gpu"] rather than a hand-rolled std.gpu kernel.
      # Because npm's && chain stops at the first failure, matmul also hid the
      # three suites behind it — the exact trap documented for `npm test`.
      #
      # Suites are ordered and labelled by kernel style to test the hypothesis
      # that split them: hand-rolled std.gpu kernels run on the runner's Metal
      # device, while linalg/layout-backed ones do not. Those are tiers 2 vs 3/4
      # in docs/mojo-runtime-isolation-spike-findings.md.
      - name: simd-search — hand-rolled std.gpu
        id: t_search
        continue-on-error: true
        run: pixi run node examples/simd-search/test_cached.js

      - name: stats — hand-rolled std.gpu
        id: t_stats
        continue-on-error: true
        run: pixi run node examples/stats/test_cached.js

      - name: image — hand-rolled std.gpu
        id: t_image
        continue-on-error: true
        run: pixi run node examples/image/test_cached.js

      - name: matmul — linalg/layout
        id: t_matmul
        continue-on-error: true
        run: pixi run node examples/matmul/test_cached.js

      - name: packages/retrieve — linalg/layout
        id: t_retrieve
        continue-on-error: true
        run: pixi run bash -c "cd packages/retrieve && npm test"

      - name: Verdict matrix
        run: |
          {
            echo "## Metal GPU execution on \`macos-latest\`"
            echo ""
            echo "| Suite | Kernel style | Result |"
            echo "|---|---|---|"
            echo "| simd-search | hand-rolled \`std.gpu\` | ${{ steps.t_search.outcome }} |"
            echo "| stats | hand-rolled \`std.gpu\` | ${{ steps.t_stats.outcome }} |"
            echo "| image | hand-rolled \`std.gpu\` | ${{ steps.t_image.outcome }} |"
            echo "| matmul | \`linalg\`/\`layout\` | ${{ steps.t_matmul.outcome }} |"
            echo "| packages/retrieve | \`linalg\`/\`layout\` | ${{ steps.t_retrieve.outcome }} |"
            echo ""
            echo "Promote exactly the suites that pass into \`test.yml\`; leave the rest to"
            echo "\`scripts/verify-all.sh\` (local) and \`scripts/verify-gpu-h100.sh\` (pod)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "search=${{ steps.t_search.outcome }} stats=${{ steps.t_stats.outcome }} image=${{ steps.t_image.outcome }} matmul=${{ steps.t_matmul.outcome }} retrieve=${{ steps.t_retrieve.outcome }}"
