[workspace]
authors = ["Wm Talcott <wtalcott@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max-nightly/"]
name = "mojo-addon-examples"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
max = ">=26.3.0.dev2026040905"
nodejs = ">=22.12"
# Spike deps for MAX's BertPipelineModel (sentence-transformers/all-MiniLM-L6-v2).
# Needed to load the HF checkpoint through max.pipelines.architectures.bert.
pydantic = ">=2.0"
transformers = ">=4.40"
safetensors = ">=0.4"
huggingface_hub = ">=0.20"
pillow = ">=10.0"
